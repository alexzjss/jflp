<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <title>{% block title %}JFLP Studio{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="lateral">
    <div class="marca">JFLP Studio</div>
    {# páginas internas que acendem um item principal #}
    {% set destaque = {"bugs": "resultados", "lote": "resultados", "job": "rodar"}.get(page, page) %}
    <a href="/rodar" class="{{ 'ativo' if destaque == 'rodar' else '' }}">Rodar</a>
    <a href="/resultados" class="{{ 'ativo' if destaque == 'resultados' else '' }}">Resultados
      <span class="selo-vaga" hx-get="/fila/contagem" hx-trigger="load, every 4s" hx-swap="innerHTML"></span></a>
    <a href="/ambiente" class="{{ 'ativo' if destaque == 'ambiente' else '' }}">Ambiente</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>
    // recusas das ações da fila (htmx) chegam como texto simples: mostra num alerta
    document.body.addEventListener("htmx:responseError", function (e) {
      var t = e.detail.xhr.responseText || "";
      if (t && t.charAt(0) !== "<") { alert(t.slice(0, 300)); }
    });
  </script>
</body>
</html>
